<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mythos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <link rel="stylesheet" href="style.css">

   

</head>
<body>
    

 <!--================== MENU ===========-->
<nav class="navbar navbar-light bg-transparent mb-0 sticky-top pt-3 pe-4">
    <div class="container-fluid">
        <!-- Logo (Izquierda) -->
        <span class="navbar-brand mb-0 h1">
            <img src="img/logo.png" alt="Logo Mythos" style="height: 90px; width: auto;">
        </span>
        
        <!-- Pestañas de Login/Registro (Derecha) -->
        <div class="d-flex">
            <ul class="nav nav-tabs" id="aut" role="tablist">
                <li class="nav-item">
                    <button data-bs-target="#login" data-bs-toggle="tab" type="button" role="tab" id="login-tab" class="nav-link active" aria-controls="login" aria-selected="true">
                        Iniciar Sesión
                    </button>
                </li>
                <li class="nav-item">
                    <button data-bs-target="#register" data-bs-toggle="tab" type="button" role="tab" id="register-tab" class="nav-link" aria-controls="register" aria-selected="false">
                        Registrarse
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!--================== LOGIN / REGISTER (Contenidos) ===========-->

<div class="container-fluid d-flex justify-content-end pe-4">
    <div id="loginSection" class="login-container mt-3" style="width: 700px;">
        <div class="login-card">
            
            <!--================== Paneles de login y registro ===========-->
            <div class="tab-content" id="autContent">
                
                <!-- Panel de Login -->
                <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
                    <!-- El formulario AHORA ESTÁ ADENTRO de este div -->
                    <form id="formLogin">
                        <div class="mb-3">
                            <label for="inputUser" class="form-label">Usuario</label>
                            <input required placeholder="Ingrese Usuario" type="text" class="form-control" id="inputUser">
                        </div>
                        <div class="mb-3">
                            <label for="inputPassword" class="form-label">Password</label>
                            <input required placeholder="Ingrese contraseña" type="password" class="form-control" id="inputPassword">
                        </div>
                        <button type="submit" class="btn btn-gold w-100 mt-3">Ingresar</button>
                    </form>
                </div> <!-- Aquí cerramos correctamente el panel de login -->
                

                <!-- Panel de Registro -->
                <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="register-tab">
                    <form id="formRegister">
                        <div class="mb-3">
                            <label for="inputNombre" class="form-label">Nombre Completo</label>
                            <input required placeholder="Tu nombre completo" type="email" class="form-control" id="inputNombre">
                        </div>

                         <div class="mb-3">
                            <label for="inputEmailr" class="form-label">Email</label>
                            <input required placeholder="Tu@Email.com" type="text" class="form-control" id="inputEmail">
                        </div>

                         <div class="mb-3">
                            <label for="inputUseReg" class="form-label">Usuario</label>
                            <input required placeholder="Nombre de usuario unico" type="text" class="form-control" id="inputUseReg">
                        </div>
                         <div class="mb-3">
                            <label for="inputPasswordReg" class="form-label">Contraseña</label>
                            <input required placeholder="Minimo 6 caracteres" type="password" class="form-control" id="inputPasswordReg">
                            <small class="text-muted">Debes tener al menos 6 caracteres</small>
                        </div>
                         <div class="mb-3">
                            <label for="inputConfirmPassword" class="form-label">Confirmacion Contraseña</label>
                            <input required  placeholder="Ingrese contraseña" class="form-control" id="inputConfirmPassword">
                        </div>
                        
                        <button type="submit" class="btn btn-gold w-100 mt-3">Crear Cuenta</button>
                    </form>
                </div> <!-- Aquí cerramos el panel de registro -->
                
            </div>
            
        </div>
    </div>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    

    <script src="app.js"></script>
</body>
</html>
