<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mythos - Biblioteca de Películas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Tus estilos personalizados -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<!--================== MENU ===========-->
<nav class="navbar navbar-light bg-transparent mb-0 sticky-top pt-3 pe-4">
    <div class="container-fluid">
        <!-- Logo (Izquierda) -->
        <span class="navbar-brand mb-0 h1">
            <img src="img/logo.png" alt="Logo Mythos" style="height: 90px; width: auto;">
        </span>
        
        <!-- Pestañas de Login/Registro y Botones (Derecha) -->
        <div class="d-flex align-items-center">
            
            <!-- Pestañas (Se ocultan al entrar) -->
            <ul class="nav nav-tabs mb-0" id="aut" role="tablist">
                <li class="nav-item">
                    <button data-bs-target="#login" data-bs-toggle="tab" type="button" role="tab" id="login-tab" class="nav-link active" aria-controls="login" aria-selected="true">
                        Iniciar Sesión
                    </button>
                </li>
                <li class="nav-item">
                    <button data-bs-target="#register" data-bs-toggle="tab" type="button" role="tab" id="register-tab" class="nav-link" aria-controls="register" aria-selected="false">
                        Registrarse
                    </button>
                </li>
            </ul>

            <!-- Placa con el nombre del usuario logueado (Aparece al entrar) -->
            <div class="userLogged fw-bold px-4 py-2 ms-3 shadow" style="background: #f4f4f4; border: 2px solid #c4a265; border-radius: 8px; color: #4a3b32; font-family: serif; font-size: 1.2rem; letter-spacing: 1px; display: inline-block;"></div>

            <!-- Botón Agregar Película (Conecta con el Modal y se muestra al entrar) -->
            <button id="btnAgregarPelicula" class="btn btn-gold d-none ms-3 d-flex align-items-center" style="padding: 5px 15px;" data-bs-toggle="modal" data-bs-target="#exampleModal">
                <img src="img/rollo.png" alt="Añadir" style="height: 36px; margin-right: 8px;">
                Agregar Película
            </button>

            <!-- Botón Salir (Con tu icono circular y se muestra al entrar) -->
            <button id="btnSalir" class="btn btn-gold d-none ms-3 d-flex align-items-center" style="padding: 5px 15px;">
                <img src="img/iconoSalir.png" alt="Salir" style="height: 38px; width: 38px; object-fit: cover; border-radius: 50%; margin-right: 8px; ">
                Salir
            </button>
            
        </div>
    </div>
</nav>

<!--================== LOGIN / REGISTER (Contenidos) ===========-->

<div class="container-fluid d-flex justify-content-end pe-4">
    <div id="loginSection" class="login-container mt-3" style="width: 700px;">
        <div class="login-card">
            
            <!--================== Paneles de login y registro ===========-->
            <div class="tab-content" id="autContent">
                
                <!-- Panel de Login -->
                <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
                    <form id="formLogin">
                        <div class="mb-3">
                            <label for="inputUser" class="form-label">Usuario</label>
                            <input required placeholder="Ingrese Usuario" type="text" class="form-control" id="inputUser">
                        </div>
                        <div class="mb-3">
                            <label for="inputPassword" class="form-label">Password</label>
                            <input required placeholder="Ingrese contraseña" type="password" class="form-control" id="inputPassword">
                        </div>
                        <button type="submit" class="btn btn-gold w-100 mt-3">Ingresar</button>
                    </form>
                </div> 
                
                <!-- Panel de Registro -->
                <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="register-tab">
                    <form id="formRegister">
                        <div class="mb-3">
                            <label for="inputNombre" class="form-label">Nombre Completo</label>
                            <input required placeholder="Tu nombre completo" type="text" class="form-control" id="inputNombre">
                        </div>

                        <div class="mb-3">
                            <label for="inputEmail" class="form-label">Email</label>
                            <input required placeholder="Tu@Email.com" type="email" class="form-control" id="inputEmail">
                        </div>

                        <div class="mb-3">
                            <label for="inputUseReg" class="form-label">Usuario</label>
                            <input required placeholder="Nombre de usuario unico" type="text" class="form-control" id="inputUseReg">
                        </div>
                        <div class="mb-3">
                            <label for="inputPasswordReg" class="form-label">Contraseña</label>
                            <input required placeholder="Minimo 8 caracteres" type="password" class="form-control" id="inputPasswordReg">
                            <small class="text-muted">Debes tener al menos 8 caracteres</small>
                        </div>
                        <div class="mb-3">
                            <label for="inputConfirmPassword" class="form-label">Confirmación Contraseña</label>
                            <input required placeholder="Ingrese contraseña nuevamente" type="password" class="form-control" id="inputConfirmPassword">
                        </div>
                        
                        <button type="submit" class="btn btn-gold w-100 mt-3">Crear Cuenta</button>
                    </form>
                </div> 
                
            </div>
            
        </div>
    </div>
</div>

<!--================== SESION DASHBOARD ===========-->
<div id="dashboard" style="display: none;">
    <div class="container my-4">
        <!-- El título ahora vive dentro del dashboard -->
        <h4 class="mb-3">Todas las películas</h4>
        
        <div id="gridPeliculas" class="row g-4">
            <!-- Aquí van las películas dinámicamente -->
        </div>

        <div id="sinResultados" class="alert alert-info text-center" style="display: none;">
            <img src="img/CIRCULO.png" alt="circulo" style="height: 38px; width: 38px; object-fit: cover; border-radius: 50%; margin-right: 8px;">
            No se encontraron películas
        </div>
    </div>
</div>
<!--================== MODAL AGREGAR PELÍCULA ===========-->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" style="background-color: #f4f4f4; border: 2px solid #c4a265;">
      <div class="modal-header" style="border-bottom: 1px solid #c4a265;">
        <h1 class="modal-title fs-5 fw-bold" id="exampleModalLabel" style="font-family: serif; color: #4a3b32;  "   > Agregar Nueva Película</h1>
         <img src="img/icono jaron.png" alt="Añadir" style="height: 56px; margin-right: 15px;">
                
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formAgregarPelicula">
            <div class="mb-3">
                <label for="inputTitulo" class="form-label fw-bold">Título de la Película</label>
                <input type="text" class="form-control" id="inputTitulo" placeholder="Ej. Gladiador" required>
            </div>
            <div class="mb-3">
                <label for="inputGenero" class="form-label fw-bold">Género</label>
               <select class="form-select" name="genero" id="inputGenero">
                <option value="">Selecciones Genero</option>
                <option value="ACCION">ACCION</option>
                <option value="DRAMA">DRAMA</option>
                <option value="CIENCIA FICCION">CIENCIA FICCION</option>
                <option value="TERROR">TERROR</option>
                <option value="AVENTURA">AVENTURA</option>
                <option value="ANIMADO">ANIMADO</option>
                <option value="COMEDIA">COMEDIA</option>
                
               </select>
            </div>
            <div class="mb-3">
                <label for="inputDirector" class="form-label fw-bold">Director</label>
                <input type="text" class="form-control" id="inputDirector" placeholder="Ej. Gladiador" required>
            </div>
            <div class="mb-3">
                <label for="inputAno" class="form-label fw-bold">año</label>
                <input type="number" class="form-control" id="inputAno"  min="1900" required>
            </div>
            <div class="mb-3">
                <label for="inputCalificacion" class="form-label fw-bold">Calificacion (1-10)</label>
                <input type="number" class="form-control" id="inputCalificacion"  min="1" max="10 step="0.1" required>
            </div>
             <div class="mb-3">
                <label for="inputDescripcion" class="form-label fw-bold">Descripcion</label>
                <textarea class="form-control" id="inputDescripcion" rows="3"  required ></textarea>
            </div>
            <div class="mb-3">
                <label for="inputImagen" class="form-label fw-bold">URL de Imagen</label>
                <input type="url" class="form-control" id="inputImagen" required>
            </div>
        </form>
      </div>
      <div class="modal-footer" style="border-top: 1px solid #c4a265;">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-gold">Guardar Película</button>
      </div>
    </div>
  </div>
</div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <!-- Lógica de la aplicación -->
    <script src="app.js"></script>
</body>
</html>
